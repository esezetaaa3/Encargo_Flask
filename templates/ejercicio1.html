
{% extends "base.html" %}

{% block titulo %}Ejercicio 1{% endblock %}

{% block contenido %}

<div class="contenedor">

    <h2>Ejercicio 1: Notas y asistencia</h2>

    <form method="POST">

        <label>Nota 1 (10 a 70)</label>
        <input type="number" name="nota1" min="10" max="70" step="any" required>

        <label>Nota 2 (10 a 70)</label>
        <input type="number" name="nota2" min="10" max="70" step="any" required>

        <label>Nota 3 (10 a 70)</label>
        <input type="number" name="nota3" min="10" max="70" step="any" required>

        <label>Asistencia (0 a 100%)</label>
        <input type="number" name="asistencia" min="0" max="100" required>

        <button type="submit">Enviar</button>

    </form>

    <a href="{{ url_for('inicio') }}">Volver al menú</a>

</div>

{% endblock %}
